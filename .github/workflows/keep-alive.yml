# Render's free tier puts the API to sleep after ~15 idle minutes, and the
# next visitor waits up to a minute for it to wake. Pinging it keeps it up.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://torii-schedule-api-ii.onrender.com/api/health
