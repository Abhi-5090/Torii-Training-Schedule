<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Torii">
  <!--
    The torii gate from the wordmark, redrawn to the artwork's own proportions:
    lintel 8.6% of the gate height, legs 7.4% of its width, the inner stem
    11/149 wide starting 33.6% down, the spark centred at 21.5% down.
    On a dark tile, the way the logo sits on the hero — so the white stem still
    reads against a light browser tab strip.
  -->
  <rect width="32" height="32" rx="7" fill="#141414"/>

  <g fill="#F15D23">
    <rect x="6"     y="7.4" width="20"   height="1.5"/>   <!-- lintel -->
    <rect x="6"     y="7.4" width="1.5"  height="17.2"/>  <!-- left leg -->
    <rect x="24.5"  y="7.4" width="1.5"  height="17.2"/>  <!-- right leg -->
  </g>

  <!-- the eight-point spark that sits above the stem -->
  <g stroke="#F15D23" stroke-width="0.5" stroke-linecap="round">
    <path d="M15.95 9.8v2.6M15.95 13.9v-.1M14.65 11.1h2.6"/>
    <path d="M15.03 10.18l1.84 1.84M16.87 10.18l-1.84 1.84"/>
  </g>
  <circle cx="15.95" cy="11.1" r="0.85" fill="#F15D23"/>

  <rect x="15.2" y="13.2" width="1.5" height="11.4" fill="#FFFFFF"/>  <!-- inner stem -->
</svg>
